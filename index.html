<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>真实贪吃蛇 - 微信版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            touch-action: manipulation;
        }
        
        .game-header {
            text-align: center;
            margin-bottom: 15px;
        }
        
        h1 {
            color: #4CAF50;
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .game-info {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 10px;
        }
        
        .info-item {
            text-align: center;
        }
        
        .info-label {
            font-size: 12px;
            opacity: 0.8;
        }
        
        .info-value {
            font-size: 18px;
            font-weight: bold;
            color: #4CAF50;
        }
        
        #gameCanvas {
            border: 3px solid #34495e;
            background: #1a252f;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 100px;
        }
        
        button:active {
            background: #c0392b;
            transform: scale(0.95);
        }
        
        .mobile-controls {
            display: grid;
            grid-template-areas: 
                ". up ."
                "left . right"
                ". down .";
            gap: 15px;
            margin: 15px 0;
        }
        
        .control-btn {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }
        
        .control-btn:active {
            transform: scale(0.9);
            box-shadow: 0 2px 8px rgba(52, 152, 219, 0.5);
        }
        
        .up { grid-area: up; }
        .left { grid-area: left; }
        .right { grid-area: right; }
        .down { grid-area: down; }
        
        .instructions {
            text-align: center;
            color: #bdc3c7;
            font-size: 14px;
            line-height: 1.4;
            margin-top: 10px;
        }
        
        .weixin-tip {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 10000;
            color: white;
            text-align: center;
            padding: 50px 20px;
        }
        
        .weixin-content {
            margin-top: 40%;
        }
        
        .close-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 微信提示 -->
    <div id="weixinTip" class="weixin-tip">
        <div class="weixin-content">
            <h3>🎮 游戏提示</h3>
            <p>点击方向按钮控制蛇的移动</p>
            <p>吃红色苹果增长身体</p>
            <button class="close-btn" onclick="closeWeixinTip()">开始游戏</button>
        </div>
    </div>
    
    <div class="game-header">
        <h1>🐍 真实贪吃蛇 🍎</h1>
    </div>
    
    <div class="game-info">
        <div class="info-item">
            <div class="info-label">得分</div>
            <div class="info-value" id="score">0</div>
        </div>
        <div class="info-item">
            <div class="info-label">长度</div>
            <div class="info-value" id="length">1</div>
        </div>
        <div class="info-item">
            <div class="info-label">时间</div>
            <div class="info-value" id="time">00:00</div>
        </div>
    </div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div class="controls">
        <button onclick="startGame()">开始游戏</button>
        <button onclick="resetGame()">重新开始</button>
    </div>
    
    <div class="mobile-controls">
        <div class="control-btn up" ontouchstart="changeDirection('UP')">↑</div>
        <div class="control-btn left" ontouchstart="changeDirection('LEFT')">←</div>
        <div class="control-btn right" ontouchstart="changeDirection('RIGHT')">→</div>
        <div class="control-btn down" ontouchstart="changeDirection('DOWN')">↓</div>
    </div>
    
    <div class="instructions">
        <p>使用方向按钮控制，吃红色苹果得分！</p>
        <p>撞到墙壁或自己的身体游戏结束</p>
    </div>

    <script>
        // 微信环境检测
        function isWeixin() {
            return /micromessenger/i.test(navigator.userAgent);
        }
        
        function showWeixinTip() {
            document.getElementById('weixinTip').style.display = 'block';
        }
        
        function closeWeixinTip() {
            document.getElementById('weixinTip').style.display = 'none';
        }
        
        // 初始化微信检测
        if (isWeixin()) {
            setTimeout(showWeixinTip, 500);
        }
        
        // 游戏变量
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameRunning = false;
        let gameLoop;
        let startTime = 0;
        let gameTime = 0;
        let timeInterval;
        
        // 绘制真实感的蛇
        function drawSnake() {
            snake.forEach((segment, index) => {
                const isHead = index === 0;
                const x = segment.x * gridSize;
                const y = segment.y * gridSize;
                
                if (isHead) {
                    // 蛇头 - 圆形带眼睛
                    ctx.fillStyle = '#27ae60';
                    ctx.beginPath();
                    ctx.arc(x + gridSize/2, y + gridSize/2, gridSize/2 - 1, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 眼睛
                    ctx.fillStyle = 'white';
                    const eyeSize = 3;
                    const eyeOffset = 4;
                    ctx.beginPath();
                    ctx.arc(x + eyeOffset, y + eyeOffset, eyeSize, 0, Math.PI * 2);
                    ctx.arc(x + gridSize - eyeOffset, y + eyeOffset, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 瞳孔
                    ctx.fillStyle = 'black';
                    ctx.beginPath();
                    ctx.arc(x + eyeOffset, y + eyeOffset, 1, 0, Math.PI * 2);
                    ctx.arc(x + gridSize - eyeOffset, y + eyeOffset, 1, 0, Math.PI * 2);
                    ctx.fill();
                    
                } else {
                    // 蛇身 - 圆形渐变
                    const gradient = ctx.createRadialGradient(
                        x + gridSize/2, y + gridSize/2, 0,
                        x + gridSize/2, y + gridSize/2, gridSize/2 - 1
                    );
                    gradient.addColorStop(0, '#2ecc71');
                    gradient.addColorStop(1, '#27ae60');
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(x + gridSize/2, y + gridSize/2, gridSize/2 - 1, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }
        
        // 绘制苹果
        function drawFood() {
            const x = food.x * gridSize + gridSize/2;
            const y = food.y * gridSize + gridSize/2;
            const radius = gridSize/2 - 2;
            
            // 苹果主体
            const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
            gradient.addColorStop(0, '#ff6b6b');
            gradient.addColorStop(1, '#e74c3c');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
            
            // 苹果梗
            ctx.strokeStyle = '#8b4513';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, y - radius + 2);
            ctx.lineTo(x, y - radius - 3);
            ctx.stroke();
            
            // 苹果叶子
            ctx.fillStyle = '#2ecc71';
            ctx.beginPath();
            ctx.ellipse(x + 3, y - radius - 1, 3, 2, Math.PI/4, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // 绘制游戏
        function drawGame() {
            // 清空画布
            ctx.fillStyle = '#1a252f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格背景
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
            
            drawSnake();
            drawFood();
        }
        
        // 移动蛇
        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            // 检查碰撞
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }
            
            for (let segment of snake) {
                if (segment.x === head.x && segment.y === head.y) {
                    gameOver();
                    return;
                }
            }
            
            snake.unshift(head);
            
            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                createFood();
                updateDisplay();
            } else {
                snake.pop();
            }
        }
        
        // 创建食物
        function createFood() {
            let newFood;
            let foodOnSnake;
            
            do {
                foodOnSnake = false;
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                
                for (let segment of snake) {
                    if (segment.x === newFood.x && segment.y === newFood.y) {
                        foodOnSnake = true;
                        break;
                    }
                }
            } while (foodOnSnake);
            
            food = newFood;
        }
        
        // 更新显示
        function updateDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('length').textContent = snake.length;
        }
        
        // 更新时间显示
        function updateTime() {
            if (gameRunning) {
                gameTime = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(gameTime / 60).toString().padStart(2, '0');
                const seconds = (gameTime % 60).toString().padStart(2, '0');
                document.getElementById('time').textContent = `${minutes}:${seconds}`;
            }
        }
        
        // 游戏结束
        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            clearInterval(timeInterval);
            setTimeout(() => {
                alert(`游戏结束！\n得分: ${score}\n长度: ${snake.length}\n时间: ${document.getElementById('time').textContent}`);
            }, 100);
        }
        
        // 改变方向
        function changeDirection(direction) {
            if (!gameRunning) return;
            
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;
            
            switch(direction) {
                case 'UP':
                    if (!goingDown) { dx = 0; dy = -1; }
                    break;
                case 'DOWN':
                    if (!goingUp) { dx = 0; dy = 1; }
                    break;
                case 'LEFT':
                    if (!goingRight) { dx = -1; dy = 0; }
                    break;
                case 'RIGHT':
                    if (!goingLeft) { dx = 1; dy = 0; }
                    break;
            }
        }
        
        // 开始游戏
        function startGame() {
            if (gameRunning) return;
            
            dx = 1;
            dy = 0;
            gameRunning = true;
            startTime = Date.now();
            
            // 游戏主循环 - 降低速度到200ms
            gameLoop = setInterval(() => {
                moveSnake();
                drawGame();
            }, 200);
            
            // 时间更新循环
            timeInterval = setInterval(updateTime, 1000);
        }
        
        // 重置游戏
        function resetGame() {
            clearInterval(gameLoop);
            clearInterval(timeInterval);
            snake = [{x: 10, y: 10}];
            food = {x: 15, y: 15};
            dx = 0;
            dy = 0;
            score = 0;
            gameRunning = false;
            gameTime = 0;
            document.getElementById('time').textContent = '00:00';
            updateDisplay();
            drawGame();
        }
        
        // 键盘控制
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp': changeDirection('UP'); break;
                case 'ArrowDown': changeDirection('DOWN'); break;
                case 'ArrowLeft': changeDirection('LEFT'); break;
                case 'ArrowRight': changeDirection('RIGHT'); break;
            }
        });
        
        // 初始化游戏
        drawGame();
        updateDisplay();
    </script>
</body>
</html>
